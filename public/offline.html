<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6B1F36" />
  <title>UAMA — Sem conexão</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#FAF7F2; color:#292524;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; }
    main { max-width:520px; text-align:center; background:#fff; border:1px solid #e7e5e4; border-radius:24px; padding:36px 28px;
      box-shadow:0 20px 60px rgba(0,0,0,.08); }
    .icon { width:64px;height:64px;border-radius:18px;background:#6B1F36;color:#fff;display:grid;place-items:center;
      margin:0 auto 18px;font-size:28px;font-weight:800; }
    h1 { margin:0 0 10px;font-size:28px; }
    p { line-height:1.6;color:#57534e; }
    button { margin-top:14px;border:0;border-radius:14px;padding:13px 20px;background:#6B1F36;color:#fff;font-weight:700;font-size:16px; }
  </style>
</head>
<body>
  <main>
    <div class="icon">U</div>
    <h1>Você está sem conexão</h1>
    <p>O aplicativo UAMA precisa de internet para inscrições e para carregar informações atualizadas.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
